<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Kalender - 出席管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #20283a;
      font-family: sans-serif;
    }

    header, main, .summary {
      max-width: 600px;
      margin: 20px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .description, .status {
      color: #687386;
      font-size: 14px;
    }

    .date-picker, .summary, .card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    input[type="date"] {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #dce1eb;
      border-radius: 9px;
      font-size: 16px;
    }

    .card h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid #dce1eb;
      border-radius: 9px;
      padding: 10px 13px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    button.selected {
      background: #3659d9;
      color: white;
      border-color: #3659d9;
    }

    .summary p {
      margin: 6px 0;
    }

    footer {
      text-align: center;
      color: #687386;
      font-size: 12px;
      margin: 30px 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 Kalender</h1>
    <p class="description">
      日付ごとに大学の出席状況を記録しよう。
    </p>
  </header>

  <main>
    <section class="date-picker">
      <label for="recordDate">記録する日付</label>
      <input type="date" id="recordDate">
    </section>

    <section class="summary">
      <h2>今日の記録</h2>
      <p id="summaryText">読み込み中...</p>
    </section>

    <section id="classes"></section>
  </main>

  <footer>Kalender · 出席管理</footer>

  <script>
    const lessons = [
      { id: 1, name: "国際経済学" },
      { id: 2, name: "経済政策論" },
      { id: 3, name: "情報リテラシー" }
    ];

    const storageKey = "kalender-attendance-v2";
    const dateInput = document.getElementById("recordDate");

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = localDateString();

    function getAllRecords() {
      try {
        return JSON.parse(
          localStorage.getItem(storageKey) || "{}"
        );
      } catch {
        return {};
      }
    }

    function getRecordsForDate() {
      const allRecords = getAllRecords();
      return allRecords[dateInput.value] || {};
    }

    function saveRecord(lessonId, status) {
      const allRecords = getAllRecords();
      const date = dateInput.value;

      if (!allRecords[date]) {
        allRecords[date] = {};
      }

      if (status === "") {
        delete allRecords[date][lessonId];
      } else {
        allRecords[date][lessonId] = status;
      }

      if (Object.keys(allRecords[date]).length === 0) {
        delete allRecords[date];
      }

      localStorage.setItem(
        storageKey,
        JSON.stringify(allRecords)
      );

      render();
    }

    function render() {
      const records = getRecordsForDate();
      const root = document.getElementById("classes");

      root.replaceChildren();

      lessons.forEach(lesson => {
        const current = records[lesson.id] || "";

        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = lesson.name;

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "記録：" + (current || "未記録");

        const buttons = document.createElement("div");
        buttons.className = "buttons";

        const options = [
          ["出席", "出席"],
          ["欠席", "欠席"],
          ["遅刻", "遅刻"],
          ["取り消し", ""]
        ];

        options.forEach(([label, value]) => {
          const button = document.createElement("button");
          button.textContent = label;

          if (value !== "" && current === value) {
            button.className = "selected";
          }

          button.addEventListener("click", () => {
            saveRecord(lesson.id, value);
          });

          buttons.appendChild(button);
        });

        card.append(title, status, buttons);
        root.appendChild(card);
      });

      const values = Object.values(records);
      const attended = values.filter(
        value => value === "出席" || value === "遅刻"
      ).length;
      const absent = values.filter(
        value => value === "欠席"
      ).length;
      const unrecorded = lessons.length - values.length;

      document.getElementById("summaryText").textContent =
        `出席・遅刻：${attended}　欠席：${absent}　未記録：${unrecorded}`;
    }

    dateInput.addEventListener("change", render);

    render();
  </script>
</body>
</html>
