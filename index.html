<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Kalender - 出席管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #20283a;
      font-family: sans-serif;
    }

    header,
    main {
      max-width: 600px;
      margin: 20px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
    }

    .description,
    .status,
    .lesson-time {
      color: #687386;
      font-size: 14px;
    }

    .date-picker,
    .summary,
    .card,
    .editor {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    input,
    select {
      display: block;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #dce1eb;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    label {
      display: block;
      font-size: 14px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 6px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid #dce1eb;
      border-radius: 9px;
      padding: 10px 13px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    button.selected,
    button.primary {
      background: #3659d9;
      color: white;
      border-color: #3659d9;
    }

    button.danger {
      color: #b42318;
    }

    .summary p {
      margin: 6px 0;
    }

    .editor h2 {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #687386;
      font-size: 12px;
      margin: 30px 0;
    }

    .timetable {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    .timetable-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .timetable table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      text-align: center;
      table-layout: fixed;
    }

    .timetable th,
    .timetable td {
      border: 1px solid #dce1eb;
      padding: 10px 6px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .timetable th {
      background: #f0f3fa;
    }

    .timetable td {
      height: 65px;
    }

    .timetable td.has-lesson {
      background: #e8edff;
      color: #243da0;
      font-weight: bold;
    }

    .timetable .period-label {
      width: 65px;
      white-space: nowrap;
      font-weight: bold;
      background: #f8f9fc;
    }

    /* 予定 */
    textarea {
      display: block;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #dce1eb;
      border-radius: 9px;
      font-size: 16px;
      font-family: inherit;
      resize: vertical;
    }

    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .event-item {
      border-left: 4px solid #3659d9;
      background: #f5f7ff;
      border-radius: 9px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .event-item .event-title {
      font-weight: bold;
      margin: 0 0 4px;
      overflow-wrap: anywhere;
    }

    .event-item .event-meta,
    .event-item .event-memo {
      color: #687386;
      font-size: 13px;
      margin: 0 0 6px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event-item .buttons button {
      padding: 6px 10px;
      font-size: 13px;
    }

    .upcoming-item {
      display: flex;
      gap: 10px;
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      align-items: baseline;
    }

    .upcoming-item .upcoming-date {
      color: #3659d9;
      font-weight: bold;
      white-space: nowrap;
    }

    .upcoming-item .upcoming-title {
      overflow-wrap: anywhere;
    }

    .empty {
      color: #687386;
      font-size: 14px;
      margin: 6px 0;
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 Kalender</h1>
    <p class="description">
      日付ごとに大学の出席状況を記録しよう。
    </p>
  </header>

  <main>
    <section class="date-picker">
      <label for="recordDate">記録する日付</label>
      <input type="date" id="recordDate">
    </section>

    <section class="summary">
      <h2 id="summaryHeading">今日の記録</h2>
      <p id="summaryText">読み込み中...</p>
    </section>

    <section class="summary">
			<h2>📊 累計出席率</h2>
			<div id="attendanceRates">
  		  読み込み中...
  		</div>
		</section>

    <section class="summary">
      <h2 id="eventsHeading">📝 この日の予定</h2>
      <ul class="event-list" id="eventsForDate"></ul>
    </section>

    <section class="summary">
      <h2>🔔 これからの予定</h2>
      <div id="upcomingEvents"></div>
    </section>

		<section id="classes"></section>

    <section class="timetable">
      <h2>📅 今日の時間割</h2>

      <div class="timetable-scroll">
        <table>
          <thead>
            <tr id="timetableHeader">
              <th>時限</th>
              <th>今日</th>
            </tr>
          </thead>

          <tbody id="timetableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="editor">
      <h2 id="formHeading">授業を追加</h2>

      <form id="lessonForm">
        <label for="lessonName">授業名</label>
        <input
          id="lessonName"
          type="text"
          maxlength="80"
          placeholder="例：国際経済学"
          required
        >

        <label for="lessonDay">曜日</label>
        <select id="lessonDay">
          <option value="">曜日を選択（任意）</option>
          <option value="月曜日">月曜日</option>
          <option value="火曜日">火曜日</option>
          <option value="水曜日">水曜日</option>
          <option value="木曜日">木曜日</option>
          <option value="金曜日">金曜日</option>
          <option value="土曜日">土曜日</option>
          <option value="日曜日">日曜日</option>
        </select>

        <label for="lessonPeriod">時限</label>
        <select id="lessonPeriod">
          <option value="">時限を選択（任意）</option>
          <option value="1">1限</option>
          <option value="2">2限</option>
          <option value="3">3限</option>
          <option value="4">4限</option>
          <option value="5">5限</option>
          <option value="6">6限</option>
          <option value="7">7限</option>
        </select>

        <div class="buttons">
          <button
            class="primary"
            type="submit"
            id="saveLessonButton"
          >授業を追加</button>

          <button
            type="button"
            id="cancelEditButton"
            class="hidden"
          >編集をキャンセル</button>
        </div>
      </form>
    </section>

    <section class="editor" id="eventEditor">
      <h2 id="eventFormHeading">予定を追加</h2>

      <form id="eventForm">
        <label for="eventTitle">予定名</label>
        <input
          id="eventTitle"
          type="text"
          maxlength="80"
          placeholder="例：レポート提出、バイト、ゼミ発表"
          required
        >

        <label for="eventDate">日付</label>
        <input id="eventDate" type="date" required>

        <label for="eventTime">時間（任意）</label>
        <input id="eventTime" type="time">

        <label for="eventMemo">メモ（任意）</label>
        <textarea
          id="eventMemo"
          rows="2"
          maxlength="300"
          placeholder="例：A4で3枚、Moodleから提出"
        ></textarea>

        <div class="buttons">
          <button
            class="primary"
            type="submit"
            id="saveEventButton"
          >予定を追加</button>

          <button
            type="button"
            id="cancelEventEditButton"
            class="hidden"
          >編集をキャンセル</button>
        </div>
      </form>
    </section>
  </main>

  <footer>Kalender · 出席管理</footer>

  <script>
    const defaultLessons = [
      { id: 1, name: "国際経済学", day: "", period: "" },
      { id: 2, name: "経済政策論", day: "", period: "" },
      { id: 3, name: "情報リテラシー", day: "", period: "" }
    ];

    const attendanceStorageKey = "kalender-attendance-v2";
    const lessonsStorageKey = "kalender-lessons-v1";

    const dateInput = document.getElementById("recordDate");
    const lessonForm = document.getElementById("lessonForm");
    const nameInput = document.getElementById("lessonName");
    const dayInput = document.getElementById("lessonDay");
    const periodInput = document.getElementById("lessonPeriod");
    const formHeading = document.getElementById("formHeading");
    const saveLessonButton = document.getElementById("saveLessonButton");
    const cancelEditButton = document.getElementById("cancelEditButton");

    let editingLessonId = null;

    // 授業データを読み込む
    function loadLessons() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(lessonsStorageKey) || "null"
        );

        if (Array.isArray(saved)) {
          return saved;
        }
      } catch (error) {
        console.error("授業データの読み込みに失敗しました", error);
      }

      localStorage.setItem(
        lessonsStorageKey,
        JSON.stringify(defaultLessons)
      );

      return defaultLessons.map(lesson => ({ ...lesson }));
    }

    let lessons = loadLessons();

    // 授業データを保存する
    function saveLessons() {
      localStorage.setItem(
        lessonsStorageKey,
        JSON.stringify(lessons)
      );
    }

    // 今日の日付を YYYY-MM-DD 形式にする
    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = localDateString();

    // 保存済みの出席記録をすべて取得する
    function getAllRecords() {
      try {
        return JSON.parse(
          localStorage.getItem(attendanceStorageKey) || "{}"
        );
      } catch (error) {
        console.error("出席記録の読み込みに失敗しました", error);
        return {};
      }
    }

    // 選択中の日付の出席記録を取得する
    function getRecordsForDate() {
      const allRecords = getAllRecords();
      return allRecords[dateInput.value] || {};
    }

    // 出席状況を保存する
    function saveRecord(lessonId, status) {
      const allRecords = getAllRecords();
      const date = dateInput.value;

      if (!allRecords[date]) {
        allRecords[date] = {};
      }

      if (status === "") {
        delete allRecords[date][lessonId];
      } else {
        allRecords[date][lessonId] = status;
      }

      if (Object.keys(allRecords[date]).length === 0) {
        delete allRecords[date];
      }

      localStorage.setItem(
        attendanceStorageKey,
        JSON.stringify(allRecords)
      );

      render();
    }

    // 授業フォームを初期状態に戻す
    function resetLessonForm() {
      editingLessonId = null;
      lessonForm.reset();

      formHeading.textContent = "授業を追加";
      saveLessonButton.textContent = "授業を追加";
      cancelEditButton.classList.add("hidden");
    }

    // 授業の編集を開始する
    function startEditingLesson(lesson) {
      editingLessonId = lesson.id;

      nameInput.value = lesson.name;
      dayInput.value = lesson.day || "";
      periodInput.value = lesson.period || "";

      formHeading.textContent = "授業を編集";
      saveLessonButton.textContent = "変更を保存";
      cancelEditButton.classList.remove("hidden");

      document.querySelector(".editor").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      nameInput.focus();
    }

    // 今日の曜日だけを表示する時間割
    function renderTimetable() {
      const tbody = document.getElementById("timetableBody");
      const header = document.getElementById("timetableHeader");

      if (!tbody || !header) {
        return;
      }

      tbody.replaceChildren();
      header.replaceChildren();

      // JavaScriptの曜日番号は日曜日が0、月曜日が1
      const dayNames = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
      ];

      const selectedDate = new Date(dateInput.value + "T12:00:00");
			const selectedDay = dayNames[selectedDate.getDay()];
      
      // 見出しを作る
      const periodHeader = document.createElement("th");
      periodHeader.textContent = "時限";
      header.appendChild(periodHeader);

      const todayHeader = document.createElement("th");
      todayHeader.textContent = selectedDay;
      header.appendChild(todayHeader);

      // 1限から7限までの行を作る
      for (let period = 1; period <= 7; period++) {
        const tr = document.createElement("tr");

        const label = document.createElement("td");
        label.className = "period-label";
        label.textContent = `${period}限`;

        const cell = document.createElement("td");
        cell.id = `today-period-${period}`;

        tr.appendChild(label);
        tr.appendChild(cell);

        tbody.appendChild(tr);
      }

      // 今日の曜日に該当する授業だけを表示する
      lessons.forEach(lesson => {
        if (lesson.day !== selectedDay || !lesson.period) {
          return;
        }

        const cell = document.getElementById(
          `today-period-${lesson.period}`
        );

        if (!cell) {
          return;
        }

        if (cell.textContent) {
          cell.textContent += " / " + lesson.name;
        } else {
          cell.textContent = lesson.name;
        }

        cell.classList.add("has-lesson");
      });
    }

  		// 授業ごとの累計出席率を計算して表示する
function renderAttendanceRates() {
  const root = document.getElementById("attendanceRates");
  if (!root) return;

  root.replaceChildren();

  if (lessons.length === 0) {
    root.textContent = "授業を登録してください。";
    return;
  }

  const allRecords = getAllRecords();
  const selectedDate = new Date(dateInput.value + "T12:00:00");
  const semesterStart = new Date("2026-09-25T12:00:00");
  const semesterEnd = new Date("2027-01-08T12:00:00");

  lessons.forEach(lesson => {
    let attended = 0;
    let absent = 0;
    let late = 0;

    Object.entries(allRecords).forEach(([date, dayRecords]) => {
      const classDate = new Date(date + "T12:00:00");

      // 学期開始前・選択日より後の記録は無視する
      if (classDate < semesterStart || classDate > selectedDate) {
        return;
      }

      // 冬休み中の記録は無視する
      if (date >= "2026-12-26" && date <= "2027-01-03") {
        return;
      }

      const status = dayRecords[lesson.id];

      if (status === "出席") attended++;
      if (status === "欠席") absent++;
      if (status === "遅刻") late++;
    });

    const total = attended + absent + late;
    const attendanceCount = attended + late;

    const rate = total > 0
      ? Math.floor(attendanceCount / total * 100)
      : null;

    const p = document.createElement("p");
    p.style.margin = "8px 0";

    p.textContent = total > 0
      ? `${lesson.name}：出席 ${attended}回・遅刻 ${late}回・欠席 ${absent}回｜出席率 ${rate}%`
      : `${lesson.name}：まだ記録がありません`;

    root.appendChild(p);
  });
}

    // 出席管理画面を更新する
    function render() {
      const records = getRecordsForDate();
      const root = document.getElementById("classes");

      root.replaceChildren();

      const selectedDate = new Date(
        dateInput.value + "T12:00:00"
      );

      document.getElementById("summaryHeading").textContent =
        `${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日の記録`;

      // 選択した日付の曜日を取得する
			const dayNames = [
  			"日曜日",
  			"月曜日",
  			"火曜日",
  			"水曜日",
  			"木曜日",
  			"金曜日",
  			"土曜日"
			];

			const selectedDay = dayNames[selectedDate.getDay()];

			// 選択した曜日の授業だけ表示する
			lessons
  			.filter(lesson => lesson.day === selectedDay)
  			.forEach(lesson => {
    			const current = records[lesson.id] || "";

    	  const card = document.createElement("section");
    	  card.className = "card";

        const title = document.createElement("h2");
        title.textContent = lesson.name;

        const time = document.createElement("p");
        time.className = "lesson-time";

        time.textContent = [
          lesson.day || "曜日未設定",
          lesson.period ? lesson.period + "限" : "時限未設定"
        ].join("・");

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "記録：" + (current || "未記録");

        const attendanceButtons = document.createElement("div");
        attendanceButtons.className = "buttons";

        [
          ["出席", "出席"],
          ["欠席", "欠席"],
          ["遅刻", "遅刻"],
          ["取り消し", ""]
        ].forEach(([label, value]) => {
          const button = document.createElement("button");
          button.textContent = label;

          if (value !== "" && current === value) {
            button.className = "selected";
          }

          button.addEventListener("click", () => {
            saveRecord(lesson.id, value);
          });

          attendanceButtons.appendChild(button);
        });

        // 編集・削除ボタン
        const editButtons = document.createElement("div");
        editButtons.className = "buttons";
        editButtons.style.marginTop = "12px";

        const editButton = document.createElement("button");
        editButton.textContent = "授業を編集";

        editButton.addEventListener("click", () => {
          startEditingLesson(lesson);
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "授業を削除";
        deleteButton.className = "danger";

        deleteButton.addEventListener("click", () => {
          const confirmed = confirm(
            `「${lesson.name}」を削除しますか？\nこの授業は一覧から消えます。`
          );

          if (!confirmed) {
            return;
          }

          lessons = lessons.filter(
            item => item.id !== lesson.id
          );

          saveLessons();

          if (editingLessonId === lesson.id) {
            resetLessonForm();
          }

          render();
        });

        editButtons.append(editButton, deleteButton);

        card.append(
          title,
          time,
          status,
          attendanceButtons,
          editButtons
        );

        root.appendChild(card);
      });

      // 出席状況を集計する
      const values = Object.values(records).filter(
        value => ["出席", "欠席", "遅刻"].includes(value)
      );

      const attended = values.filter(
        value => value === "出席" || value === "遅刻"
      ).length;

      const absent = values.filter(
        value => value === "欠席"
      ).length;

      // 未記録はこの日の曜日の授業だけで数える
      const lessonsForDay = lessons.filter(
        lesson => lesson.day === selectedDay
      );

      const unrecorded = lessonsForDay.filter(
        lesson => !["出席", "欠席", "遅刻"].includes(records[lesson.id])
      ).length;

      document.getElementById("summaryText").textContent =
  		`出席・遅刻：${attended}　欠席：${absent}　未記録：${unrecorded}`;

		renderAttendanceRates();
		renderTimetable();
		renderEvents();
  		  }

    // ===== 予定 =====
    const eventsStorageKey = "kalender-events-v1";

    const eventForm = document.getElementById("eventForm");
    const eventTitleInput = document.getElementById("eventTitle");
    const eventDateInput = document.getElementById("eventDate");
    const eventTimeInput = document.getElementById("eventTime");
    const eventMemoInput = document.getElementById("eventMemo");
    const eventFormHeading = document.getElementById("eventFormHeading");
    const saveEventButton = document.getElementById("saveEventButton");
    const cancelEventEditButton = document.getElementById("cancelEventEditButton");

    let editingEventId = null;

    // 予定データを読み込む
    function loadEvents() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(eventsStorageKey) || "[]"
        );
        return Array.isArray(saved) ? saved : [];
      } catch (error) {
        console.error("予定データの読み込みに失敗しました", error);
        return [];
      }
    }

    let events = loadEvents();

    // 予定データを保存する
    function saveEvents() {
      localStorage.setItem(eventsStorageKey, JSON.stringify(events));
    }

    // 日付・時間順に並べる（時間なしはその日の先頭）
    function compareEvents(a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.time || "").localeCompare(b.time || "");
    }

    // 「11月18日(水)」形式
    function formatDateLabel(dateString) {
      const date = new Date(dateString + "T12:00:00");
      const week = ["日", "月", "火", "水", "木", "金", "土"];
      return `${date.getMonth() + 1}月${date.getDate()}日(${week[date.getDay()]})`;
    }

    // 予定フォームを初期状態に戻す
    function resetEventForm() {
      editingEventId = null;
      eventForm.reset();
      eventDateInput.value = dateInput.value;

      eventFormHeading.textContent = "予定を追加";
      saveEventButton.textContent = "予定を追加";
      cancelEventEditButton.classList.add("hidden");
    }

    // 予定の編集を開始する
    function startEditingEvent(item) {
      editingEventId = item.id;

      eventTitleInput.value = item.title;
      eventDateInput.value = item.date;
      eventTimeInput.value = item.time || "";
      eventMemoInput.value = item.memo || "";

      eventFormHeading.textContent = "予定を編集";
      saveEventButton.textContent = "変更を保存";
      cancelEventEditButton.classList.remove("hidden");

      document.getElementById("eventEditor").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      eventTitleInput.focus();
    }

    // 選択中の日付の予定と、これからの予定を表示する
    function renderEvents() {
      const list = document.getElementById("eventsForDate");
      const upcoming = document.getElementById("upcomingEvents");

      list.replaceChildren();
      upcoming.replaceChildren();

      document.getElementById("eventsHeading").textContent =
        `📝 ${formatDateLabel(dateInput.value)}の予定`;

      // 編集中でなければ、フォームの日付を選択中の日付に合わせる
      if (editingEventId === null) {
        eventDateInput.value = dateInput.value;
      }

      const todays = events
        .filter(item => item.date === dateInput.value)
        .sort(compareEvents);

      if (todays.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "予定はありません。";
        list.appendChild(empty);
      }

      todays.forEach(item => {
        const li = document.createElement("li");
        li.className = "event-item";

        const title = document.createElement("p");
        title.className = "event-title";
        title.textContent = item.title;

        const meta = document.createElement("p");
        meta.className = "event-meta";
        meta.textContent = item.time ? `🕒 ${item.time}` : "終日";

        li.append(title, meta);

        if (item.memo) {
          const memo = document.createElement("p");
          memo.className = "event-memo";
          memo.textContent = item.memo;
          li.appendChild(memo);
        }

        const buttons = document.createElement("div");
        buttons.className = "buttons";

        const editButton = document.createElement("button");
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => startEditingEvent(item));

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "danger";
        deleteButton.addEventListener("click", () => {
          if (!confirm(`「${item.title}」を削除しますか？`)) {
            return;
          }

          events = events.filter(e => e.id !== item.id);
          saveEvents();

          if (editingEventId === item.id) {
            resetEventForm();
          }

          renderEvents();
        });

        buttons.append(editButton, deleteButton);
        li.appendChild(buttons);
        list.appendChild(li);
      });

      // 今日以降の予定を近い順に5件
      const today = localDateString();
      const next = events
        .filter(item => item.date >= today)
        .sort(compareEvents)
        .slice(0, 5);

      if (next.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "これからの予定はありません。";
        upcoming.appendChild(empty);
        return;
      }

      next.forEach(item => {
        // タップするとその日に移動する
        const button = document.createElement("button");
        button.type = "button";
        button.className = "upcoming-item";

        const date = document.createElement("span");
        date.className = "upcoming-date";
        date.textContent =
          formatDateLabel(item.date) + (item.time ? " " + item.time : "");

        const title = document.createElement("span");
        title.className = "upcoming-title";
        title.textContent = item.title;

        button.append(date, title);
        button.addEventListener("click", () => {
          dateInput.value = item.date;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        upcoming.appendChild(button);
      });
    }

    // 予定の追加・編集を保存する
    eventForm.addEventListener("submit", event => {
      event.preventDefault();

      const title = eventTitleInput.value.trim();
      const date = eventDateInput.value;

      if (!title || !date) {
        alert("予定名と日付を入力してください。");
        return;
      }

      const data = {
        title,
        date,
        time: eventTimeInput.value,
        memo: eventMemoInput.value.trim()
      };

      if (editingEventId !== null) {
        events = events.map(item =>
          item.id === editingEventId ? { ...item, ...data } : item
        );
      } else {
        const newId = events.reduce(
          (max, item) => Math.max(max, Number(item.id) || 0),
          0
        ) + 1;

        events.push({ id: newId, ...data });
      }

      saveEvents();
      resetEventForm();

      // 追加した予定の日付に移動して表示する
      dateInput.value = date;
      render();
    });

    cancelEventEditButton.addEventListener("click", resetEventForm);

    // 授業の追加・編集を保存する
    lessonForm.addEventListener("submit", event => {
      event.preventDefault();

      const name = nameInput.value.trim();

      if (!name) {
        alert("授業名を入力してください。");
        return;
      }

      if (editingLessonId !== null) {
        // 既存の授業を編集する
        lessons = lessons.map(lesson =>
          lesson.id === editingLessonId
            ? {
                ...lesson,
                name,
                day: dayInput.value,
                period: periodInput.value
              }
            : lesson
        );
      } else {
        // 新しい授業を追加する
        const newId = lessons.reduce(
          (max, lesson) =>
            Math.max(max, Number(lesson.id) || 0),
          0
        ) + 1;

        lessons.push({
          id: newId,
          name,
          day: dayInput.value,
          period: periodInput.value
        });
      }

      saveLessons();
      resetLessonForm();
      render();
    });

    // 編集をキャンセルする
    cancelEditButton.addEventListener(
      "click",
      resetLessonForm
    );

    // 記録する日付が変更されたら画面を更新する
    dateInput.addEventListener("change", render);

    // 最初の画面を表示する
    render();
  </script>
</body>
</html>
