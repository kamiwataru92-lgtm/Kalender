<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Kalender - 出席管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #20283a;
      font-family: sans-serif;
    }

    header,
    main {
      max-width: 600px;
      margin: 20px auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      font-size: 18px;
    }

    .description,
    .status,
    .lesson-time {
      color: #687386;
      font-size: 14px;
    }

    .date-picker,
    .summary,
    .card,
    .editor {
      background: white;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    input,
    select {
      display: block;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #dce1eb;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    label {
      display: block;
      font-size: 14px;
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 6px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid #dce1eb;
      border-radius: 9px;
      padding: 10px 13px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }

    button.selected,
    button.primary {
      background: #3659d9;
      color: white;
      border-color: #3659d9;
    }

    button.danger {
      color: #b42318;
    }

    .summary p {
      margin: 6px 0;
    }

    .editor h2 {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #687386;
      font-size: 12px;
      margin: 30px 0;
    }

    .timetable {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px #00000008;
    }

    .timetable-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .timetable table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      text-align: center;
      table-layout: fixed;
    }

    .timetable th,
    .timetable td {
      border: 1px solid #dce1eb;
      padding: 10px 6px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .timetable th {
      background: #f0f3fa;
    }

    .timetable td {
      height: 65px;
    }

    .timetable td.has-lesson {
      background: #e8edff;
      color: #243da0;
      font-weight: bold;
    }

    .timetable .period-label {
      width: 65px;
      white-space: nowrap;
      font-weight: bold;
      background: #f8f9fc;
    }
  </style>
</head>

<body>
  <header>
    <h1>📚 Kalender</h1>
    <p class="description">
      日付ごとに大学の出席状況を記録しよう。
    </p>
  </header>

  <main>
    <section class="date-picker">
      <label for="recordDate">記録する日付</label>
      <input type="date" id="recordDate">
    </section>

    <section class="summary">
      <h2 id="summaryHeading">今日の記録</h2>
      <p id="summaryText">読み込み中...</p>
    </section>

    <section id="classes"></section>

    <section class="timetable">
      <h2>📅 今日の時間割</h2>

      <div class="timetable-scroll">
        <table>
          <thead>
            <tr id="timetableHeader">
              <th>時限</th>
              <th>今日</th>
            </tr>
          </thead>

          <tbody id="timetableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="editor">
      <h2 id="formHeading">授業を追加</h2>

      <form id="lessonForm">
        <label for="lessonName">授業名</label>
        <input
          id="lessonName"
          type="text"
          maxlength="80"
          placeholder="例：国際経済学"
          required
        >

        <label for="lessonDay">曜日</label>
        <select id="lessonDay">
          <option value="">曜日を選択（任意）</option>
          <option value="月曜日">月曜日</option>
          <option value="火曜日">火曜日</option>
          <option value="水曜日">水曜日</option>
          <option value="木曜日">木曜日</option>
          <option value="金曜日">金曜日</option>
          <option value="土曜日">土曜日</option>
          <option value="日曜日">日曜日</option>
        </select>

        <label for="lessonPeriod">時限</label>
        <select id="lessonPeriod">
          <option value="">時限を選択（任意）</option>
          <option value="1">1限</option>
          <option value="2">2限</option>
          <option value="3">3限</option>
          <option value="4">4限</option>
          <option value="5">5限</option>
          <option value="6">6限</option>
          <option value="7">7限</option>
        </select>

        <div class="buttons">
          <button
            class="primary"
            type="submit"
            id="saveLessonButton"
          >授業を追加</button>

          <button
            type="button"
            id="cancelEditButton"
            class="hidden"
          >編集をキャンセル</button>
        </div>
      </form>
    </section>
  </main>

  <footer>Kalender · 出席管理</footer>

  <script>
    const defaultLessons = [
      { id: 1, name: "国際経済学", day: "", period: "" },
      { id: 2, name: "経済政策論", day: "", period: "" },
      { id: 3, name: "情報リテラシー", day: "", period: "" }
    ];

    const attendanceStorageKey = "kalender-attendance-v2";
    const lessonsStorageKey = "kalender-lessons-v1";

    const dateInput = document.getElementById("recordDate");
    const lessonForm = document.getElementById("lessonForm");
    const nameInput = document.getElementById("lessonName");
    const dayInput = document.getElementById("lessonDay");
    const periodInput = document.getElementById("lessonPeriod");
    const formHeading = document.getElementById("formHeading");
    const saveLessonButton = document.getElementById("saveLessonButton");
    const cancelEditButton = document.getElementById("cancelEditButton");

    let editingLessonId = null;

    // 授業データを読み込む
    function loadLessons() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(lessonsStorageKey) || "null"
        );

        if (Array.isArray(saved)) {
          return saved;
        }
      } catch (error) {
        console.error("授業データの読み込みに失敗しました", error);
      }

      localStorage.setItem(
        lessonsStorageKey,
        JSON.stringify(defaultLessons)
      );

      return defaultLessons.map(lesson => ({ ...lesson }));
    }

    let lessons = loadLessons();

    // 授業データを保存する
    function saveLessons() {
      localStorage.setItem(
        lessonsStorageKey,
        JSON.stringify(lessons)
      );
    }

    // 今日の日付を YYYY-MM-DD 形式にする
    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    dateInput.value = localDateString();

    // 保存済みの出席記録をすべて取得する
    function getAllRecords() {
      try {
        return JSON.parse(
          localStorage.getItem(attendanceStorageKey) || "{}"
        );
      } catch (error) {
        console.error("出席記録の読み込みに失敗しました", error);
        return {};
      }
    }

    // 選択中の日付の出席記録を取得する
    function getRecordsForDate() {
      const allRecords = getAllRecords();
      return allRecords[dateInput.value] || {};
    }

    // 出席状況を保存する
    function saveRecord(lessonId, status) {
      const allRecords = getAllRecords();
      const date = dateInput.value;

      if (!allRecords[date]) {
        allRecords[date] = {};
      }

      if (status === "") {
        delete allRecords[date][lessonId];
      } else {
        allRecords[date][lessonId] = status;
      }

      if (Object.keys(allRecords[date]).length === 0) {
        delete allRecords[date];
      }

      localStorage.setItem(
        attendanceStorageKey,
        JSON.stringify(allRecords)
      );

      render();
    }

    // 授業フォームを初期状態に戻す
    function resetLessonForm() {
      editingLessonId = null;
      lessonForm.reset();

      formHeading.textContent = "授業を追加";
      saveLessonButton.textContent = "授業を追加";
      cancelEditButton.classList.add("hidden");
    }

    // 授業の編集を開始する
    function startEditingLesson(lesson) {
      editingLessonId = lesson.id;

      nameInput.value = lesson.name;
      dayInput.value = lesson.day || "";
      periodInput.value = lesson.period || "";

      formHeading.textContent = "授業を編集";
      saveLessonButton.textContent = "変更を保存";
      cancelEditButton.classList.remove("hidden");

      document.querySelector(".editor").scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      nameInput.focus();
    }

    // 今日の曜日だけを表示する時間割
    function renderTimetable() {
      const tbody = document.getElementById("timetableBody");
      const header = document.getElementById("timetableHeader");

      if (!tbody || !header) {
        return;
      }

      tbody.replaceChildren();
      header.replaceChildren();

      // JavaScriptの曜日番号は日曜日が0、月曜日が1
      const dayNames = [
        "日曜日",
        "月曜日",
        "火曜日",
        "水曜日",
        "木曜日",
        "金曜日",
        "土曜日"
      ];

      const today = new Date();
      const todayName = dayNames[today.getDay()];
console.log("今日の曜日:", todayName);
console.log("登録されている授業:", lessons.map(lesson => ({
  name: lesson.name,
  day: lesson.day,
  period: lesson.period
})));

      // 見出しを作る
      const periodHeader = document.createElement("th");
      periodHeader.textContent = "時限";
      header.appendChild(periodHeader);

      const todayHeader = document.createElement("th");
      todayHeader.textContent = todayName;
      header.appendChild(todayHeader);

      // 1限から7限までの行を作る
      for (let period = 1; period <= 7; period++) {
        const tr = document.createElement("tr");

        const label = document.createElement("td");
        label.className = "period-label";
        label.textContent = `${period}限`;

        const cell = document.createElement("td");
        cell.id = `today-period-${period}`;

        tr.appendChild(label);
        tr.appendChild(cell);

        tbody.appendChild(tr);
      }

      // 今日の曜日に該当する授業だけを表示する
      lessons.forEach(lesson => {
        if (lesson.day !== todayName || !lesson.period) {
          return;
        }

        const cell = document.getElementById(
          `today-period-${lesson.period}`
        );

        if (!cell) {
          return;
        }

        if (cell.textContent) {
          cell.textContent += " / " + lesson.name;
        } else {
          cell.textContent = lesson.name;
        }

        cell.classList.add("has-lesson");
      });
    }

    // 出席管理画面を更新する
    function render() {
      const records = getRecordsForDate();
      const root = document.getElementById("classes");

      root.replaceChildren();

      const selectedDate = new Date(
        dateInput.value + "T12:00:00"
      );

      document.getElementById("summaryHeading").textContent =
        `${selectedDate.getMonth() + 1}月${selectedDate.getDate()}日の記録`;

      // 登録済みの授業ごとにカードを作る
      lessons.forEach(lesson => {
        const current = records[lesson.id] || "";

        const card = document.createElement("section");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = lesson.name;

        const time = document.createElement("p");
        time.className = "lesson-time";

        time.textContent = [
          lesson.day || "曜日未設定",
          lesson.period ? lesson.period + "限" : "時限未設定"
        ].join("・");

        const status = document.createElement("p");
        status.className = "status";
        status.textContent = "記録：" + (current || "未記録");

        const attendanceButtons = document.createElement("div");
        attendanceButtons.className = "buttons";

        [
          ["出席", "出席"],
          ["欠席", "欠席"],
          ["遅刻", "遅刻"],
          ["取り消し", ""]
        ].forEach(([label, value]) => {
          const button = document.createElement("button");
          button.textContent = label;

          if (value !== "" && current === value) {
            button.className = "selected";
          }

          button.addEventListener("click", () => {
            saveRecord(lesson.id, value);
          });

          attendanceButtons.appendChild(button);
        });

        // 編集・削除ボタン
        const editButtons = document.createElement("div");
        editButtons.className = "buttons";
        editButtons.style.marginTop = "12px";

        const editButton = document.createElement("button");
        editButton.textContent = "授業を編集";

        editButton.addEventListener("click", () => {
          startEditingLesson(lesson);
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "授業を削除";
        deleteButton.className = "danger";

        deleteButton.addEventListener("click", () => {
          const confirmed = confirm(
            `「${lesson.name}」を削除しますか？\nこの授業は一覧から消えます。`
          );

          if (!confirmed) {
            return;
          }

          lessons = lessons.filter(
            item => item.id !== lesson.id
          );

          saveLessons();

          if (editingLessonId === lesson.id) {
            resetLessonForm();
          }

          render();
        });

        editButtons.append(editButton, deleteButton);

        card.append(
          title,
          time,
          status,
          attendanceButtons,
          editButtons
        );

        root.appendChild(card);
      });

      // 出席状況を集計する
      const values = Object.values(records).filter(
        value => ["出席", "欠席", "遅刻"].includes(value)
      );

      const attended = values.filter(
        value => value === "出席" || value === "遅刻"
      ).length;

      const absent = values.filter(
        value => value === "欠席"
      ).length;

      const unrecorded = Math.max(
        0,
        lessons.length - values.length
      );

      document.getElementById("summaryText").textContent =
        `出席・遅刻：${attended}　欠席：${absent}　未記録：${unrecorded}`;

      // 時間割も更新する
      renderTimetable();
    }

    // 授業の追加・編集を保存する
    lessonForm.addEventListener("submit", event => {
      event.preventDefault();

      const name = nameInput.value.trim();

      if (!name) {
        alert("授業名を入力してください。");
        return;
      }

      if (editingLessonId !== null) {
        // 既存の授業を編集する
        lessons = lessons.map(lesson =>
          lesson.id === editingLessonId
            ? {
                ...lesson,
                name,
                day: dayInput.value,
                period: periodInput.value
              }
            : lesson
        );
      } else {
        // 新しい授業を追加する
        const newId = lessons.reduce(
          (max, lesson) =>
            Math.max(max, Number(lesson.id) || 0),
          0
        ) + 1;

        lessons.push({
          id: newId,
          name,
          day: dayInput.value,
          period: periodInput.value
        });
      }

      saveLessons();
      resetLessonForm();
      render();
    });

    // 編集をキャンセルする
    cancelEditButton.addEventListener(
      "click",
      resetLessonForm
    );

    // 記録する日付が変更されたら画面を更新する
    dateInput.addEventListener("change", render);

    // 最初の画面を表示する
    render();
  </script>
</body>
</html>
